<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-label="Papercut illustration: a bridge carrying tokens between two riverbanks, gears turning underneath">
  <defs>
    <filter id="dw" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="3" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9"/>
    </filter>
    <filter id="dw2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
    </filter>
    <filter id="ds" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="dg">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="9" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.16  0 0 0 0 0.13  0 0 0 0 0.10  0 0 0 0.6 0"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <linearGradient id="dsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C3D6DE"/><stop offset="0.7" stop-color="#EDE4CE"/><stop offset="1" stop-color="#F6F1E6"/>
    </linearGradient>
  </defs>
  <rect width="720" height="480" fill="url(#dsky)"/>
  <!-- far hills -->
  <path d="M-10,190 Q120,140 260,182 T520,170 T740,190 L740,300 L-10,300 Z" fill="#C2D3CC" opacity="0.5" filter="url(#dw)"/>
  <!-- river -->
  <path d="M-10,330 Q180,310 360,326 T740,320 L740,480 L-10,480 Z" fill="#8FB6CE" filter="url(#dw)"/>
  <path d="M-10,368 Q200,350 400,364 T740,358 L740,480 L-10,480 Z" fill="#6E96B0" opacity="0.65" filter="url(#dw)"/>
  <g stroke="#F6F1E6" stroke-width="3" opacity="0.5" fill="none" stroke-linecap="round">
    <path d="M120,392 q30,-8 60,0"/><path d="M470,404 q34,-8 68,0"/><path d="M270,436 q28,-7 56,0"/><path d="M580,376 q26,-6 52,0"/>
  </g>
  <!-- left bank: mach-o blocks -->
  <path d="M-10,296 Q80,278 170,290 Q216,298 224,330 Q210,366 150,378 Q60,390 -10,376 Z" fill="#EADAB5" filter="url(#dw)"/>
  <path d="M-10,340 Q80,356 150,352 Q200,348 222,330 L218,362 Q170,386 90,390 Q20,392 -10,384 Z" fill="#C9B380" filter="url(#dw)"/>
  <g filter="url(#dw2)">
    <rect x="26" y="212" width="58" height="84" rx="5" fill="#BC3F26"/>
    <path d="M84,212 l12,9 v75 h-12 Z" fill="#93301D"/>
    <rect x="96" y="236" width="48" height="62" rx="5" fill="#DFA83E"/>
    <path d="M144,236 l10,8 v54 h-10 Z" fill="#B9862C"/>
    <rect x="152" y="258" width="40" height="42" rx="5" fill="#B8613A"/>
  </g>
  <g fill="#F6F1E6" opacity="0.94" filter="url(#dw2)">
    <rect x="38" y="226" width="14" height="17" rx="2"/><rect x="60" y="226" width="14" height="17" rx="2"/>
    <rect x="38" y="254" width="14" height="17" rx="2"/><rect x="60" y="254" width="14" height="17" rx="2"/>
    <rect x="106" y="248" width="12" height="15" rx="2"/><rect x="124" y="248" width="12" height="15" rx="2"/>
    <rect x="160" y="268" width="10" height="13" rx="2"/><rect x="176" y="268" width="10" height="13" rx="2"/>
  </g>
  <!-- right bank: linux shapes -->
  <path d="M496,330 Q504,298 550,290 Q640,278 730,296 L730,376 Q660,390 570,378 Q510,366 496,330 Z" fill="#EADAB5" filter="url(#dw)"/>
  <path d="M498,330 Q520,348 570,352 Q640,356 730,340 L730,384 Q700,392 630,390 Q550,386 502,362 Z" fill="#C9B380" filter="url(#dw)"/>
  <g filter="url(#dw2)">
    <rect x="536" y="240" width="52" height="60" rx="5" fill="#12333B"/>
    <path d="M588,240 l11,8 v52 h-11 Z" fill="#0B2228"/>
    <rect x="600" y="216" width="60" height="84" rx="5" fill="#47705B"/>
    <path d="M660,216 l12,9 v75 h-12 Z" fill="#35543F"/>
    <rect x="668" y="252" width="42" height="48" rx="5" fill="#8FB6CE"/>
  </g>
  <g fill="#F6F1E6" opacity="0.94" filter="url(#dw2)">
    <rect x="546" y="252" width="13" height="16" rx="2"/><rect x="566" y="252" width="13" height="16" rx="2"/>
    <rect x="612" y="230" width="15" height="18" rx="2"/><rect x="636" y="230" width="15" height="18" rx="2"/>
    <rect x="612" y="260" width="15" height="18" rx="2"/><rect x="636" y="260" width="15" height="18" rx="2"/>
    <rect x="676" y="262" width="11" height="14" rx="2"/><rect x="692" y="262" width="11" height="14" rx="2"/>
  </g>
  <!-- bridge -->
  <ellipse cx="360" cy="352" rx="150" ry="20" fill="#29241E" opacity="0.16" filter="url(#ds)"/>
  <g filter="url(#dw2)">
    <path d="M212,300 Q360,258 508,300 L508,316 Q360,276 212,316 Z" fill="#B8613A"/>
    <rect x="224" y="300" width="272" height="14" rx="6" fill="#93492A"/>
    <path d="M244,314 v46 M300,306 v58 M360,302 v64 M420,306 v58 M476,314 v46" stroke="#93492A" stroke-width="9" stroke-linecap="round"/>
    <path d="M244,318 Q360,282 476,318" stroke="#DFA83E" stroke-width="5" fill="none"/>
    <g stroke="#DFA83E" stroke-width="3.5">
      <line x1="270" y1="308" x2="270" y2="300"/><line x1="330" y1="296" x2="330" y2="288"/>
      <line x1="390" y1="296" x2="390" y2="288"/><line x1="450" y1="308" x2="450" y2="300"/>
    </g>
  </g>
  <!-- tokens on the bridge -->
  <g filter="url(#dw2)">
    <rect x="286" y="268" width="22" height="22" rx="4" fill="#F6F1E6" stroke="#29241E" stroke-width="2.5"/>
    <circle cx="352" cy="272" r="12" fill="#F6F1E6" stroke="#29241E" stroke-width="2.5"/>
    <path d="M398,282 l13,-21 l13,21 Z" fill="#F6F1E6" stroke="#29241E" stroke-width="2.5"/>
  </g>
  <!-- gear under the bridge (the translation engine) -->
  <g filter="url(#dw2)">
    <g fill="#BC3F26">
      <rect x="345" y="330" width="14" height="15" rx="3"/><rect x="345" y="401" width="14" height="15" rx="3"/>
      <rect x="309" y="366" width="15" height="14" rx="3"/><rect x="380" y="366" width="15" height="14" rx="3"/>
      <rect x="317" y="338" width="14" height="14" rx="3" transform="rotate(-45 324 345)"/>
      <rect x="373" y="394" width="14" height="14" rx="3" transform="rotate(-45 380 401)"/>
    </g>
    <circle cx="352" cy="373" r="34" fill="#BC3F26"/>
    <circle cx="352" cy="373" r="13" fill="#8FB6CE"/>
    <circle cx="352" cy="373" r="5" fill="#93301D"/>
    <!-- small gear meshing -->
    <g fill="#12333B">
      <rect x="404" y="380" width="11" height="11" rx="2"/>
      <rect x="404" y="416" width="11" height="11" rx="2"/>
      <rect x="386" y="398" width="11" height="11" rx="2"/>
      <rect x="422" y="398" width="11" height="11" rx="2"/>
    </g>
    <circle cx="410" cy="403" r="20" fill="#12333B"/>
    <circle cx="410" cy="403" r="8" fill="#8FB6CE"/>
  </g>
  <!-- dock posts on the left bank -->
  <g filter="url(#dw2)">
    <rect x="206" y="352" width="10" height="34" rx="3" fill="#7A5A34"/>
    <rect x="228" y="360" width="10" height="30" rx="3" fill="#7A5A34"/>
    <path d="M211,358 q12,10 22,8" stroke="#C9B380" stroke-width="3" fill="none"/>
  </g>
  <!-- boat with token cargo -->
  <g filter="url(#dw2)">
    <path d="M120,420 q40,22 96,0 l-12,22 q-36,12 -72,0 Z" fill="#12333B"/>
    <rect x="150" y="398" width="18" height="18" rx="3" fill="#DFA83E"/>
    <rect x="172" y="402" width="14" height="14" rx="3" fill="#F6F1E6"/>
    <line x1="192" y1="420" x2="192" y2="386" stroke="#29241E" stroke-width="4"/>
    <path d="M192,386 l24,10 l-24,10 Z" fill="#BC3F26"/>
  </g>
  <!-- sun + birds -->
  <circle cx="620" cy="86" r="46" fill="#DFA83E" opacity="0.9" filter="url(#dw2)"/>
  <g stroke="#29241E" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M140,110 q7,-7 14,0 q7,-7 14,0"/><path d="M200,90 q5,-5 10,0 q5,-5 10,0"/>
  </g>
  <rect width="720" height="480" filter="url(#dg)" opacity="0.2"/>
</svg>
