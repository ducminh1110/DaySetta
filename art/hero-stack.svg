<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1040" role="img" aria-label="Papercut illustration: three floating layers — Linux bedrock, a translation layer, and an abstract city of windows on top">
  <defs>
    <filter id="wob" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="11"/>
    </filter>
    <filter id="wob2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="3" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.16  0 0 0 0 0.13  0 0 0 0 0.10  0 0 0 0.6 0"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#AECBDA"/>
      <stop offset="0.42" stop-color="#D9DCC8"/>
      <stop offset="0.72" stop-color="#EFE7D2"/>
      <stop offset="1" stop-color="#F6F1E6"/>
    </linearGradient>
    <linearGradient id="beamg" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#DFA83E" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#E9BC55" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#F1D488" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="sung" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#F5DD9A"/>
      <stop offset="0.7" stop-color="#E9BC55"/>
      <stop offset="1" stop-color="#DFA83E"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.62" stop-color="#DFA83E" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#DFA83E" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect x="0" y="0" width="880" height="1040"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="880" height="1040" fill="url(#skyg)"/>
    <!-- sun with soft halo -->
    <circle cx="672" cy="168" r="168" fill="url(#halo)"/>
    <circle cx="672" cy="168" r="104" fill="url(#sung)" filter="url(#wob2)"/>
    <!-- distant hills, fading down into paper -->
    <path d="M-20,318 Q150,252 330,308 T700,290 T920,318 L920,620 L-20,620 Z" fill="#C2D3CC" opacity="0.5" filter="url(#wob)"/>
    <path d="M-20,392 Q210,336 440,382 T920,366 L920,700 L-20,700 Z" fill="#D8D9C2" opacity="0.5" filter="url(#wob)"/>
    <!-- clouds -->
    <g filter="url(#wob2)" fill="#FBF7EC">
      <path d="M84,152 q28,-36 76,-24 q24,-28 62,-15 q40,-11 55,19 q32,4 23,30 l-216,0 q-17,-7 0,-10 Z" opacity="0.95"/>
      <path d="M520,84 q24,-27 60,-17 q29,-19 58,-2 q27,2 21,25 l-140,0 q-13,-4 1,-6 Z" opacity="0.85"/>
      <path d="M270,210 q18,-20 44,-12 q22,-13 42,-1 q19,2 15,18 l-102,0 q-9,-3 1,-5 Z" opacity="0.6"/>
    </g>
    <!-- birds -->
    <g stroke="#29241E" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.55">
      <path d="M180,258 q8,-8 16,0 q8,-8 16,0"/>
      <path d="M238,236 q6,-6 12,0 q6,-6 12,0"/>
    </g>

    <!-- ===== top layer: city of windows ===== -->
    <g>
      <ellipse cx="445" cy="486" rx="310" ry="40" fill="#29241E" opacity="0.17" filter="url(#soft)"/>
      <!-- slab: organic torn outline -->
      <path d="M128,398 Q200,378 300,372 Q420,352 520,362 Q650,368 762,396 Q772,412 754,428 Q640,456 470,470 Q300,478 168,446 Q120,428 128,398 Z" fill="#F5EDD8" filter="url(#wob)"/>
      <path d="M168,446 Q300,478 470,470 Q640,456 754,428 L750,452 Q630,482 468,494 Q300,500 176,468 Q158,458 168,446 Z" fill="#D8CBA8" filter="url(#wob)"/>
      <!-- buildings with side faces -->
      <g filter="url(#wob2)">
        <!-- b1 sky -->
        <rect x="212" y="288" width="66" height="102" rx="5" fill="#8FB6CE"/>
        <path d="M278,288 l14,10 l0,92 l-14,0 Z" fill="#6E96B0"/>
        <!-- b2 vermillion tall -->
        <rect x="298" y="252" width="84" height="134" rx="5" fill="#BC3F26"/>
        <path d="M382,252 l16,12 l0,122 l-16,0 Z" fill="#93301D"/>
        <rect x="298" y="252" width="84" height="14" rx="5" fill="#93301D"/>
        <!-- b3 ochre -->
        <rect x="404" y="296" width="60" height="92" rx="5" fill="#DFA83E"/>
        <path d="M464,296 l12,9 l0,83 l-12,0 Z" fill="#B9862C"/>
        <!-- b4 petrol tallest -->
        <rect x="486" y="234" width="92" height="152" rx="5" fill="#12333B"/>
        <path d="M578,234 l17,13 l0,139 l-17,0 Z" fill="#0B2228"/>
        <rect x="486" y="234" width="92" height="15" rx="5" fill="#0B2228"/>
        <!-- b5 sky -->
        <rect x="600" y="286" width="64" height="100" rx="5" fill="#8FB6CE"/>
        <path d="M664,286 l13,10 l0,90 l-13,0 Z" fill="#6E96B0"/>
        <!-- b6 clay -->
        <rect x="682" y="316" width="52" height="72" rx="5" fill="#B8613A"/>
        <path d="M734,316 l11,8 l0,64 l-11,0 Z" fill="#93492A"/>
      </g>
      <!-- window panes, slightly misregistered -->
      <g fill="#F6F1E6" opacity="0.94" filter="url(#wob2)" transform="translate(1.5,1)">
        <rect x="224" y="304" width="17" height="21" rx="2"/><rect x="250" y="304" width="17" height="21" rx="2"/>
        <rect x="224" y="336" width="17" height="21" rx="2"/><rect x="250" y="336" width="17" height="21" rx="2"/>
        <rect x="312" y="278" width="21" height="25" rx="2"/><rect x="346" y="278" width="21" height="25" rx="2"/>
        <rect x="312" y="316" width="21" height="25" rx="2"/><rect x="346" y="316" width="21" height="25" rx="2"/>
        <rect x="416" y="310" width="16" height="20" rx="2"/><rect x="440" y="310" width="16" height="20" rx="2"/>
        <rect x="416" y="342" width="16" height="20" rx="2"/><rect x="440" y="342" width="16" height="20" rx="2"/>
        <rect x="500" y="262" width="23" height="27" rx="2"/><rect x="538" y="262" width="23" height="27" rx="2"/>
        <rect x="500" y="302" width="23" height="27" rx="2"/><rect x="538" y="302" width="23" height="27" rx="2"/>
        <rect x="500" y="342" width="23" height="27" rx="2"/><rect x="538" y="342" width="23" height="27" rx="2"/>
        <rect x="612" y="300" width="17" height="21" rx="2"/><rect x="638" y="300" width="17" height="21" rx="2"/>
        <rect x="612" y="332" width="17" height="21" rx="2"/><rect x="638" y="332" width="17" height="21" rx="2"/>
        <rect x="692" y="328" width="14" height="18" rx="2"/><rect x="712" y="328" width="14" height="18" rx="2"/>
      </g>
      <!-- doors + awnings at street level -->
      <g filter="url(#wob2)">
        <rect x="238" y="366" width="18" height="24" rx="3" fill="#12333B"/>
        <rect x="330" y="360" width="22" height="26" rx="3" fill="#F6F1E6"/>
        <path d="M324,360 h34 l-4,-10 h-26 Z" fill="#DFA83E"/>
        <rect x="524" y="360" width="24" height="26" rx="3" fill="#DFA83E"/>
        <rect x="624" y="362" width="18" height="24" rx="3" fill="#12333B"/>
        <path d="M618,362 h30 l-4,-9 h-22 Z" fill="#BC3F26"/>
      </g>
      <!-- roof details -->
      <g stroke="#29241E" stroke-width="3" stroke-linecap="round" opacity="0.8">
        <line x1="340" y1="252" x2="340" y2="228"/><circle cx="340" cy="224" r="4.5" fill="#DFA83E" stroke="none"/>
        <line x1="532" y1="234" x2="532" y2="206"/><circle cx="532" cy="202" r="4.5" fill="#BC3F26" stroke="none"/>
        <line x1="630" y1="286" x2="630" y2="268"/>
      </g>
      <!-- chimney smoke -->
      <g fill="#FBF7EC" opacity="0.75" filter="url(#wob2)">
        <circle cx="420" cy="282" r="7"/><circle cx="428" cy="268" r="9"/><circle cx="440" cy="252" r="11"/>
      </g>
      <!-- street trees -->
      <g filter="url(#wob2)">
        <rect x="188" y="368" width="7" height="24" fill="#7A5A34"/>
        <circle cx="191" cy="356" r="17" fill="#47705B"/>
        <rect x="762" y="372" width="7" height="22" fill="#7A5A34"/>
        <circle cx="765" cy="360" r="15" fill="#47705B"/>
      </g>
    </g>

    <!-- ===== middle layer: translation works ===== -->
    <g>
      <ellipse cx="435" cy="692" rx="315" ry="42" fill="#29241E" opacity="0.16" filter="url(#soft)"/>
      <path d="M104,592 Q190,570 320,560 Q460,546 570,558 Q690,566 786,596 Q794,614 776,628 Q660,656 480,668 Q300,676 156,644 Q96,624 104,592 Z" fill="#EADAB5" filter="url(#wob)"/>
      <path d="M156,644 Q300,676 480,668 Q660,656 776,628 L770,668 Q648,700 476,710 Q298,716 162,682 Q142,668 156,644 Z" fill="#C9B380" filter="url(#wob)"/>
      <g stroke="#A98F5C" stroke-width="2.5" opacity="0.5" fill="none">
        <path d="M180,668 q150,26 290,26 q160,0 290,-26"/>
        <path d="M196,688 q150,22 276,22 q150,0 274,-24"/>
      </g>
      <!-- beams between layers -->
      <path d="M414,470 L446,470 L460,562 L400,562 Z" fill="url(#beamg)"/>
      <path d="M410,688 L450,688 L464,760 L396,760 Z" fill="url(#beamg)"/>
      <!-- rising sparks in beams -->
      <g fill="#F1D488">
        <circle cx="424" cy="530" r="4"/><circle cx="440" cy="502" r="3"/><circle cx="430" cy="548" r="2.5"/>
        <circle cx="426" cy="736" r="4"/><circle cx="442" cy="712" r="3"/><circle cx="432" cy="750" r="2.5"/>
      </g>
      <!-- big gear -->
      <g filter="url(#wob2)">
        <g fill="#BC3F26">
          <rect x="284" y="496" width="18" height="20" rx="4"/>
          <rect x="284" y="592" width="18" height="20" rx="4"/>
          <rect x="236" y="544" width="20" height="18" rx="4"/>
          <rect x="330" y="544" width="20" height="18" rx="4"/>
          <rect x="248" y="508" width="18" height="18" rx="4" transform="rotate(-45 257 517)"/>
          <rect x="320" y="580" width="18" height="18" rx="4" transform="rotate(-45 329 589)"/>
          <rect x="320" y="508" width="18" height="18" rx="4" transform="rotate(45 329 517)"/>
          <rect x="248" y="580" width="18" height="18" rx="4" transform="rotate(45 257 589)"/>
        </g>
        <circle cx="293" cy="554" r="44" fill="#BC3F26"/>
        <circle cx="293" cy="554" r="18" fill="#EADAB5"/>
        <circle cx="293" cy="554" r="7" fill="#93301D"/>
        <!-- small gear meshing -->
        <g fill="#12333B">
          <rect x="358" y="562" width="13" height="13" rx="3"/>
          <rect x="358" y="617" width="13" height="13" rx="3"/>
          <rect x="331" y="589" width="13" height="13" rx="3"/>
          <rect x="385" y="589" width="13" height="13" rx="3"/>
        </g>
        <circle cx="364" cy="596" r="26" fill="#12333B"/>
        <circle cx="364" cy="596" r="10" fill="#EADAB5"/>
      </g>
      <!-- workshop hut -->
      <g filter="url(#wob2)">
        <rect x="168" y="560" width="66" height="48" rx="4" fill="#B8613A"/>
        <path d="M162,562 l39,-26 l39,26 Z" fill="#93492A"/>
        <rect x="188" y="578" width="18" height="30" rx="2" fill="#29241E"/>
        <rect x="214" y="574" width="13" height="13" rx="2" fill="#F1D488"/>
        <rect x="222" y="524" width="9" height="22" fill="#93492A"/>
      </g>
      <g fill="#FBF7EC" opacity="0.7" filter="url(#wob2)">
        <circle cx="230" cy="514" r="6"/><circle cx="238" cy="500" r="8"/>
      </g>
      <!-- gantry crane -->
      <g filter="url(#wob2)">
        <rect x="474" y="516" width="13" height="94" fill="#12333B"/>
        <rect x="636" y="526" width="13" height="86" fill="#12333B"/>
        <rect x="464" y="508" width="196" height="13" rx="5" fill="#12333B"/>
        <path d="M487,521 l30,26 M517,521 l-30,26 M577,521 l30,26 M607,521 l-30,26" stroke="#12333B" stroke-width="4" opacity="0.55"/>
        <line x1="516" y1="521" x2="516" y2="560" stroke="#29241E" stroke-width="4"/>
        <rect x="500" y="560" width="32" height="25" rx="4" fill="#DFA83E"/>
        <path d="M500,568 h32" stroke="#B9862C" stroke-width="3"/>
        <line x1="600" y1="521" x2="600" y2="548" stroke="#29241E" stroke-width="4"/>
        <rect x="586" y="548" width="28" height="21" rx="4" fill="#8FB6CE"/>
      </g>
      <!-- conveyor of glyph tokens -->
      <g filter="url(#wob2)">
        <rect x="472" y="606" width="180" height="10" rx="5" fill="#7A5A34"/>
        <circle cx="486" cy="620" r="6" fill="#29241E"/><circle cx="560" cy="620" r="6" fill="#29241E"/><circle cx="636" cy="620" r="6" fill="#29241E"/>
        <rect x="496" y="586" width="19" height="19" rx="3" fill="#F6F1E6" stroke="#29241E" stroke-width="2.5"/>
        <circle cx="548" cy="596" r="10" fill="#F6F1E6" stroke="#29241E" stroke-width="2.5"/>
        <path d="M578,605 l11,-18 l11,18 Z" fill="#F6F1E6" stroke="#29241E" stroke-width="2.5"/>
        <rect x="618" y="586" width="19" height="19" rx="9" fill="#F6F1E6" stroke="#29241E" stroke-width="2.5"/>
      </g>
      <!-- pipes -->
      <g fill="none" stroke-linecap="round" filter="url(#wob2)">
        <path d="M676,596 q26,-24 54,-4 q10,8 22,4" stroke="#B8613A" stroke-width="10"/>
        <path d="M128,606 q20,-18 42,-4" stroke="#47705B" stroke-width="9"/>
        <path d="M700,560 q14,-14 30,-4" stroke="#8FB6CE" stroke-width="7"/>
      </g>
      <!-- crates + barrel by the crane -->
      <g filter="url(#wob2)">
        <rect x="668" y="606" width="30" height="26" rx="3" fill="#B8613A"/>
        <path d="M668,619 h30 M683,606 v26" stroke="#93492A" stroke-width="3"/>
        <rect x="676" y="584" width="22" height="20" rx="3" fill="#DFA83E"/>
        <path d="M676,594 h22" stroke="#B9862C" stroke-width="3"/>
        <rect x="712" y="600" width="22" height="32" rx="6" fill="#47705B"/>
        <path d="M712,610 h22 M712,622 h22" stroke="#35543F" stroke-width="3"/>
      </g>
      <!-- valve wheels on pipes -->
      <g stroke="#29241E" stroke-width="3" fill="#DFA83E" filter="url(#wob2)">
        <circle cx="702" cy="586" r="8"/>
        <circle cx="148" cy="596" r="7"/>
      </g>
    </g>

    <!-- ===== bottom layer: ARM Linux bedrock ===== -->
    <g>
      <ellipse cx="445" cy="912" rx="335" ry="46" fill="#29241E" opacity="0.2" filter="url(#soft)"/>
      <path d="M84,800 Q180,776 330,764 Q470,750 590,762 Q710,770 806,802 Q816,822 796,838 Q670,868 480,880 Q290,888 140,852 Q76,830 84,800 Z" fill="#1E4A54" filter="url(#wob)"/>
      <path d="M140,852 Q290,888 480,880 Q670,868 796,838 L790,884 Q660,916 478,926 Q290,932 148,894 Q128,876 140,852 Z" fill="#12333B" filter="url(#wob)"/>
      <!-- circuit traces -->
      <g stroke="#8FB6CE" stroke-width="4" fill="none" opacity="0.9" filter="url(#wob2)">
        <path d="M170,810 h96 l26,-15 h74"/>
        <path d="M232,836 h116 l22,-13 h100"/>
        <path d="M492,794 h84 l28,15 h94"/>
        <path d="M534,828 h100 l24,-13 h74"/>
      </g>
      <g fill="#DFA83E" filter="url(#wob2)">
        <circle cx="170" cy="810" r="7"/><circle cx="366" cy="795" r="7"/>
        <circle cx="232" cy="836" r="7"/><circle cx="470" cy="823" r="7"/>
        <circle cx="492" cy="794" r="7"/><circle cx="698" cy="809" r="7"/>
        <circle cx="534" cy="828" r="7"/><circle cx="732" cy="815" r="7"/>
      </g>
      <!-- chip monument -->
      <g filter="url(#wob2)">
        <g stroke="#29241E" stroke-width="6" stroke-linecap="round">
          <line x1="404" y1="748" x2="404" y2="730"/><line x1="436" y1="748" x2="436" y2="726"/><line x1="468" y1="748" x2="468" y2="730"/>
          <line x1="384" y1="768" x2="368" y2="768"/><line x1="384" y1="784" x2="368" y2="784"/>
          <line x1="488" y1="768" x2="504" y2="768"/><line x1="488" y1="784" x2="504" y2="784"/>
        </g>
        <rect x="384" y="748" width="104" height="56" rx="9" fill="#29241E"/>
        <rect x="398" y="760" width="76" height="32" rx="5" fill="#BC3F26"/>
        <rect x="410" y="768" width="20" height="16" rx="3" fill="#F1D488" opacity="0.9"/>
      </g>
      <!-- strata -->
      <g stroke="#8FB6CE" stroke-width="3" opacity="0.3" fill="none">
        <path d="M160,872 q160,26 300,26 q170,0 316,-26"/>
        <path d="M170,894 q160,24 292,24 q170,0 306,-24"/>
      </g>
      <!-- crystals on cliff -->
      <g filter="url(#wob2)">
        <path d="M210,880 l10,-24 l10,24 Z" fill="#8FB6CE" opacity="0.8"/>
        <path d="M660,876 l9,-20 l9,20 Z" fill="#8FB6CE" opacity="0.7"/>
      </g>
    </g>

    <!-- foreground torn ledge -->
    <path d="M-10,952 Q120,928 270,946 T570,940 T890,948 L890,1050 L-10,1050 Z" fill="#F6F1E6" filter="url(#wob)"/>
    <path d="M-10,972 Q150,952 320,966 T660,960 T890,968 L890,1050 L-10,1050 Z" fill="#EDE3CD" filter="url(#wob)"/>
    <g filter="url(#wob2)">
      <ellipse cx="148" cy="962" rx="27" ry="12" fill="#C9B380"/>
      <ellipse cx="196" cy="970" rx="14" ry="7" fill="#D8CBA8"/>
      <ellipse cx="700" cy="958" rx="20" ry="10" fill="#A9C2BC"/>
      <path d="M762,952 q2,-28 -13,-40 M762,952 q4,-22 19,-30" stroke="#47705B" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="747" cy="910" rx="10" ry="6.5" fill="#47705B" transform="rotate(-30 747 910)"/>
      <ellipse cx="783" cy="920" rx="10" ry="6.5" fill="#47705B" transform="rotate(24 783 920)"/>
      <circle cx="86" cy="988" r="5" fill="#BC3F26" opacity="0.7"/>
      <circle cx="820" cy="984" r="4" fill="#DFA83E" opacity="0.8"/>
    </g>

    <rect width="880" height="1040" filter="url(#grain)" opacity="0.2"/>
  </g>
</svg>
